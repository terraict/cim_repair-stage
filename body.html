<header>
  <strong class="title">施工段階</strong>
  <button id="btnTable" class="ghost" title="表を出す・隠す（3D を広く使う）">表</button>
  <button id="btnOpen" class="primary">フォルダを開く</button>
  <button id="btnOpenFile" title="フォルダを開けないブラウザのとき">ファイルを開く</button>
  <input id="fileInput" type="file" accept=".tsv,.txt" hidden>
  <span id="docName" class="doc"></span>
  <span id="dirty" class="dirty" hidden>未保存</span>
  <span id="mode" class="badge" hidden></span>
  <span class="grow"></span>
  <button id="btnFindings" class="ghost" hidden></button>
  <button id="btnEdit" hidden title="パスワードを入れると日付を変えて保存できる">編集する</button>
  <button id="btnSave" class="primary" disabled title="TSV・IFC・CSV をフォルダへ書く（Ctrl+S）">保存</button>
  <button id="btnCsv" disabled>CSV</button>
  <button id="btnIfc" disabled>IFC</button>
  <button id="btnOffline" disabled title="ネットにつながなくても見られる 1 つの HTML（閲覧のみ）を書き出す">オフライン版</button>
</header>

<main>
  <section id="left">
    <div class="filters">
      <input id="q" type="search" placeholder="名称・メモで絞る">
      <select id="fType"><option value="">タイプ：すべて</option></select>
      <select id="fStage"><option value="">段階：すべて</option></select>
      <details class="memoPick"><summary>メモの表示</summary><div id="memoPickList"></div></details>
      <span id="editTools" hidden>
        <button id="btnPalette" title="工種ごとの段階名・色・見え方。段階を足すのもここ">段階名・色</button>
        <button id="btnAddStep" hidden></button>
      </span>
    </div>
    <div id="bulk" class="bulk" hidden>
      <span id="selCount"></span>
      <button id="btnNext" class="primary" title="選んだ行それぞれの次の空いた STEP に日付を入れる">次の段階へ</button>
      <select id="bStep"></select>
      <input id="bDate" type="date">
      <button id="btnSet">入れる</button>
      <button id="btnClear">消す</button>
      <span class="memoBulk">
        <select id="bMemo" title="メモの欄"></select>
        <input id="bMemoVal" type="text" placeholder="メモ（例：材料搬入済）">
        <button id="btnMemo" title="選んだ行の、この欄に入れる（空で入れると消える）">メモを入れる</button>
      </span>
      <button id="btnUnsel" class="ghost">選択を外す</button>
    </div>
    <div id="tableWrap">
      <table id="tbl">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty">
        <p><b>フォルダを開く</b>で、案件の TSV（施工段階の正のファイル）が入ったフォルダを選びます。</p>
        <p>エクセルから移すときは <code>py tools\sheet_to_ifc.py 入力シート.xlsm --to-tsv 案件.tsv</code></p>
      </div>
    </div>
  </section>
  <div id="split" title="ドラッグで左右の幅を変える（ダブルクリックで元に戻す）"></div>
  <section id="right">
    <div id="view"></div>
    <div class="viewbar">
      <label title="色の表で「透過 1」にした段階の箇所（TerraCloud に上げる IFC には出ない）を、灰色の影で見せる。影もクリックで選べる"><input id="ghost" type="checkbox" checked> 非表示の段階も薄く表示</label>
      <label id="bgCtl" hidden title="フォルダにある補修以外の IFC（橋梁モデル）の濃さ。左端で消える">橋梁 <input id="bgOpacity" type="range" min="0" max="1" step="0.05" value="0.4"></label>
      <select id="bgMode" title="背景">
        <option value="grad">背景：暗い色</option><option value="black">背景：黒</option>
        <option value="white">背景：白</option><option value="photo">背景：航空写真</option>
        <option value="std">背景：地図</option><option value="pale">背景：淡色地図</option>
      </select>
      <button id="btnFit" class="ghost">全体</button>
    </div>
    <details class="legend"><summary>凡例</summary><div id="legend"></div></details>
    <div id="detail" class="detail" hidden></div>
    <div id="status" class="status">準備中…</div>
    <div id="attrib" class="attrib" hidden><span id="attribName">航空写真</span>：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>（位置はおおよそ）</div>
  </section>
</main>

<dialog id="dlgFindings">
  <h3>検査の結果</h3>
  <div id="findList"></div>
  <form method="dialog"><button>閉じる</button></form>
</dialog>
<dialog id="dlgPick">
  <h3>どのファイルを開きますか</h3>
  <div id="pickList"></div>
  <form method="dialog"><button>やめる</button></form>
</dialog>

<dialog id="dlgPhoto" class="photoDlg">
  <img id="photoBig" alt="">
  <div class="photoMeta"><span id="photoInfo"></span>
    <button id="btnPhotoDel" hidden>この写真を消す</button>
    <form method="dialog" style="display:inline"><button>閉じる</button></form></div>
</dialog>
<dialog id="dlgPalette">
  <h3>段階名・色</h3>
  <div><select id="palType"></select> <button id="btnPalAdd" title="この工種の最後の段階の次に足す">段階を足す</button>
    <span class="small">段階名を「－」にするとその段階は使わない。空にすると「全タイプ共通」の値</span></div>
  <table class="palTable"><thead><tr><th>段階</th><th>段階名</th><th>色</th><th>見え方</th></tr></thead><tbody id="palBody"></tbody></table>
  <form method="dialog"><button>閉じる</button></form>
</dialog>
<input id="photoInput" type="file" accept="image/*" multiple hidden>

<dialog id="dlgLogin">
  <h3>編集する</h3>
  <p>編集用のパスワードを入れてください。</p>
  <form id="fmLogin">
    <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" required>
    <button class="primary">開く</button>
    <button type="button" id="btnLoginCancel">やめる</button>
  </form>
  <p id="loginMsg" class="msg"></p>
  <p class="small"><a href="#" id="lnkSetup">編集の設定（パスワードを決める・変える）</a></p>
</dialog>
<dialog id="dlgSetup">
  <h3>編集の設定</h3>
  <p class="small">管理者のみ変更が可能です。</p>
  <form id="fmSetup">
    <label>トークン <input id="stToken" type="password" autocomplete="off" required></label>
    <label>パスワード <input id="stPw1" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>もう一度 <input id="stPw2" type="password" autocomplete="new-password" minlength="12" required></label>
    <div><button class="primary">設定する</button> <button type="button" id="btnSetupCancel">やめる</button></div>
  </form>
  <p id="setupMsg" class="msg"></p>
</dialog>
