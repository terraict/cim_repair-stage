<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%（オフライン版）</title>
<!-- 施工段階ビューアのオフライン版。閲覧のみ（保存の仕組みを持たない）。ネットにつながなくても開ける。
     three.js と形・写真はこのファイルの中に入っている。作り方は repairifc/app/offline.js -->
<script type="importmap">%%IMPORTMAP%%</script>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --line:#dde1e6; --text:#1d2329; --muted:#6b7580; --accent:#0b6fb8; --sel:#fff4c2; }
@media (prefers-color-scheme: dark) { :root { --bg:#15191d; --panel:#1d2329; --line:#333b44; --text:#e4e8ec; --muted:#98a2ad; --accent:#3d9be0; --sel:#4a4320; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 "Yu Gothic UI", "Meiryo", sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.title { font-size: 15px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--line); color: var(--muted); }
.grow { flex: 1; }
.small { font-size: 12px; color: var(--muted); }
button, select, input { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
select, input[type=search] { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 6px; }
main { flex: 1; display: grid; grid-template-columns: 50% 1fr; min-height: 0; }
body.noTable main { grid-template-columns: 1fr; }
body.noTable #left { display: none; }
#left { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
.filters { display: flex; gap: 6px; padding: 6px 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel); }
.filters input[type=search] { flex: 1; min-width: 10ch; }
#tableWrap { flex: 1; overflow: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 3px 6px; white-space: nowrap; text-align: left; }
th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
tr.sel td { background: var(--sel); }
td.num { color: var(--muted); text-align: right; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.stepLabel { color: var(--muted); font-size: 12px; margin-right: 4px; }
.memoPick { position: relative; }
.memoPick summary { cursor: pointer; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; background: var(--panel); list-style: none; }
#memoPickList { position: absolute; z-index: 5; top: 110%; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 12em; }
#memoPickList label { display: block; white-space: nowrap; }
#right { position: relative; min-height: 0; background: #20262d; container-type: size; }
#view { position: absolute; inset: 0; overflow: hidden; }
#view canvas { display: block; width: 100%; height: 100%; }
.viewbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 8px; align-items: center; color: #e4e8ec; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 16px); }
.viewbar button, .viewbar select { color: #e4e8ec; background: rgba(0,0,0,.3); border-color: #556; }
.legend { position: absolute; left: 8px; top: 8px; color: #e4e8ec; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 4px; max-height: 45%; overflow: auto; font-size: 12px; }
@container (max-width: 820px) { .legend { top: 80px; } }
.status { position: absolute; left: 8px; bottom: 8px; color: #cfd6dc; font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; }
.detail { position: absolute; left: 8px; bottom: 34px; width: min(340px, calc(100% - 16px)); max-height: 60%; overflow: auto; background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.detail h4 { margin: 0 24px 4px 0; font-size: 13px; }
.detail .x { position: absolute; right: 6px; top: 4px; border: 0; background: transparent; font-size: 16px; }
.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; margin: 6px 0 0; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.detail .sec { margin-top: 6px; font-weight: 600; }
.thumbs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.thumbs img { width: 72px; height: 54px; object-fit: cover; border-radius: 3px; cursor: zoom-in; }
dialog { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
.photoDlg { max-width: 96vw; max-height: 94vh; padding: 8px; }
.photoDlg img { display: block; max-width: 92vw; max-height: 82vh; margin: 0 auto 6px; }
.attrib { position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: #222; background: rgba(255,255,255,.75); padding: 1px 6px; border-radius: 3px; }
@media (orientation: portrait) and (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 50% 50%; } body.noTable main { grid-template-rows: 1fr; } }
</style>
</head>
<body>
<header>
  <strong class="title">施工段階</strong>
  <button id="btnTable" class="on">表</button>
  <span id="docName"></span>
  <span class="badge">オフライン版・閲覧のみ</span>
  <span class="grow"></span>
  <span id="asof" class="small"></span>
</header>
<main>
  <section id="left">
    <div class="filters">
      <input id="q" type="search" placeholder="名称・メモで絞る">
      <select id="fType"><option value="">タイプ：すべて</option></select>
      <select id="fStage"><option value="">段階：すべて</option></select>
      <details class="memoPick"><summary>メモの表示</summary><div id="memoPickList"></div></details>
    </div>
    <div id="tableWrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
  <section id="right">
    <div id="view"></div>
    <div class="viewbar">
      <label><input id="ghost" type="checkbox" checked> 非表示の段階も薄く表示</label>
      橋梁 <input id="bgOpacity" type="range" min="0" max="1" step="0.05" value="0.4">
      <select id="bgMode"><option value="photo">背景：航空写真</option><option value="grad">背景：暗い色</option><option value="white">背景：白</option></select>
      <button id="btnFit">全体</button>
    </div>
    <details class="legend"><summary>凡例</summary><div id="legend"></div></details>
    <div id="detail" class="detail" hidden></div>
    <div id="status" class="status"></div>
    <div id="attrib" class="attrib" hidden>航空写真：国土地理院（位置はおおよそ）</div>
  </section>
</main>
<dialog id="dlgPhoto" class="photoDlg"><img id="photoBig" alt=""><div><span id="photoInfo" class="small"></span> <form method="dialog" style="display:inline"><button>閉じる</button></form></div></dialog>

<script type="application/json" id="meta">%%META%%</script>
<script type="text/plain" id="bin">%%BIN%%</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const meta = JSON.parse($("meta").textContent);
const doc = meta.doc;
const rowsByNo = new Map(doc.rows.map((r) => [r.row, r]));
document.title = meta.name + "（オフライン版）";
$("docName").textContent = meta.name;
$("asof").textContent = meta.asof + " 時点";

// ---------------------------------------------------------- 形の読み込み（base64 → ArrayBuffer）
const bin = Uint8Array.from(atob($("bin").textContent.trim()), (c) => c.charCodeAt(0)).buffer;
const arr = (a) => a.t === "f" ? new Float32Array(bin, a.o, a.n) : new Uint32Array(bin, a.o, a.n);
const geos = meta.geos.map((g) => {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(arr(g.pos), 3));
  if (g.uv) geo.setAttribute("uv", new THREE.BufferAttribute(arr(g.uv), 2));
  if (g.idx) geo.setIndex(new THREE.BufferAttribute(arr(g.idx), 1));
  if (!g.uv) geo.computeVertexNormals();
  return geo;
});

// ---------------------------------------------------------- 画面
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
$("view").appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enableRotate = false;            // 回転は押した所を中心に（下の pivot）
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(1, 2, 1.5); scene.add(sun);
let W = 0, H = 0;
function resize() { const w = $("view").clientWidth, h = $("view").clientHeight; if (!w || !h || (w === W && h === H)) return; W = w; H = h; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe($("view")); resize();
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

// 補修箇所
const GHOST = new THREE.MeshBasicMaterial({ color: 0x9aa4ae, transparent: true, opacity: 0.08, depthWrite: false });
const SEL = new THREE.MeshBasicMaterial({ color: 0xffd400, transparent: true, opacity: 0.55, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
const recs = [], byRow = new Map();
for (const m of meta.repairs) {
  const head = rowsByNo.get(m.head), me = rowsByNo.get(m.member) || head;
  let mat;
  if (head.transp >= 1) mat = GHOST;
  else { const c = me.rgb || [128, 128, 128]; mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(c[0] / 255, c[1] / 255, c[2] / 255, THREE.SRGBColorSpace), transparent: me.transp > 0, opacity: 1 - me.transp, side: THREE.DoubleSide, roughness: 0.8 }); }
  const mesh = new THREE.Mesh(geos[m.g], mat);
  mesh.matrixAutoUpdate = false; mesh.matrix.fromArray(m.m);
  const rec = { mesh, rows: m.rows, hidden: head.transp >= 1 };
  mesh.userData.rec = rec;
  scene.add(mesh); recs.push(rec);
  for (const r of m.rows) { if (!byRow.has(r)) byRow.set(r, []); byRow.get(r).push(mesh); }
}
// 橋梁
const bgMats = [], bg = new THREE.Group(); scene.add(bg);
for (const b of meta.bridge) {
  const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(...b.c, THREE.SRGBColorSpace), roughness: 0.8, side: THREE.DoubleSide });
  mat.userData.opaque = b.opaque; bgMats.push(mat);
  if (b.inst) {
    const n = b.inst.n / 16, ms = arr(b.inst);
    const im = new THREE.InstancedMesh(geos[b.g], mat, n);
    for (let k = 0; k < n; k++) im.setMatrixAt(k, new THREE.Matrix4().fromArray(ms, k * 16));
    bg.add(im);
  } else bg.add(new THREE.Mesh(geos[b.g], mat));
}
function setBgOpacity(a) { bg.visible = a > 0; for (const m of bgMats) { if (m.userData.opaque) continue; m.transparent = a < 1; m.opacity = a; m.depthWrite = a >= 1; } }
setBgOpacity(0.4);
$("bgOpacity").oninput = () => setBgOpacity(Number($("bgOpacity").value));
// 航空写真
const tiles = new THREE.Group(); scene.add(tiles);
for (const t of meta.tiles) {
  const img = new Image(); img.src = t.img;
  const tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace; img.onload = () => { tex.needsUpdate = true; };
  const mesh = new THREE.Mesh(geos[t.g], new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
  mesh.renderOrder = -1; tiles.add(mesh);
}
function setBg(mode) {
  scene.background = new THREE.Color({ grad: 0x20262d, white: 0xf2f4f6, photo: 0xbfd3e6 }[mode]);
  tiles.visible = mode === "photo"; $("attrib").hidden = mode !== "photo" || !meta.tiles.length;
}
if (!meta.tiles.length) $("bgMode").value = "grad";
setBg($("bgMode").value);
$("bgMode").onchange = () => setBg($("bgMode").value);
$("ghost").onchange = () => { for (const r of recs) if (r.hidden) r.mesh.visible = $("ghost").checked; };

// 選択の表示（手前に物があっても見える黄色）
const overlay = new THREE.Group(); scene.add(overlay);
const selected = new Set();
function paintSel() {
  overlay.clear();
  for (const r of recs) if (r.rows.some((x) => selected.has(x))) { const m = new THREE.Mesh(r.mesh.geometry, SEL); m.matrixAutoUpdate = false; m.matrix.copy(r.mesh.matrix); m.renderOrder = 10; overlay.add(m); }
}

// 全体・寄る
function boxOf(ms) { const b = new THREE.Box3(); for (const m of ms) { m.geometry.computeBoundingBox(); b.union(m.geometry.boundingBox.clone().applyMatrix4(m.matrix)); } return b; }
function frame(box, side) {
  if (box.isEmpty()) return;
  resize();
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 2);
  const dir = side ? new THREE.Vector3(size.x >= size.z ? 0 : 1, 0.7, size.x >= size.z ? 1 : 0).normalize() : camera.position.clone().sub(controls.target).normalize();
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  controls.target.copy(c);
  camera.position.copy(c).addScaledVector(dir, r / Math.sin(Math.min(vf, hf) / 2) * 1.05);
  camera.near = r / 200; camera.far = r * 200; camera.updateProjectionMatrix();
}
const fit = () => frame(boxOf(recs.map((r) => r.mesh)), true);
$("btnFit").onclick = fit;

// 押した所を中心に回す・押した物を選ぶ
const ray = new THREE.Raycaster();
function hitAt(x, y) {
  const rc = renderer.domElement.getBoundingClientRect();
  camera.updateMatrixWorld();
  ray.setFromCamera(new THREE.Vector2((x - rc.left) / rc.width * 2 - 1, -(y - rc.top) / rc.height * 2 + 1), camera);
  return ray;
}
const pts = new Map(); let pivot = null, last = null, down = null, moved = false;
const dom = renderer.domElement;
dom.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, e); down = [e.clientX, e.clientY]; last = down; moved = false; pivot = null; });
dom.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId) || pts.size !== 1 || !last || (e.pointerType === "mouse" && e.buttons !== 1)) return;
  if (!moved) {
    if (Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 4) return;
    moved = true;
    const r = hitAt(down[0], down[1]);
    const h = r.intersectObjects([...recs.map((x) => x.mesh).filter((m) => m.visible), ...(bg.visible ? bg.children : [])], false)[0];
    if (h) pivot = h.point; else { const f = new THREE.Vector3(); camera.getWorldDirection(f); const d = controls.target.clone().sub(camera.position).dot(f); pivot = r.ray.origin.clone().addScaledVector(r.ray.direction, d / Math.max(r.ray.direction.dot(f), 1e-6)); }
  }
  const dx = e.clientX - last[0], dy = e.clientY - last[1]; last = [e.clientX, e.clientY];
  const up = new THREE.Vector3(0, 1, 0), hh = dom.clientHeight || 1;
  const right = new THREE.Vector3().subVectors(controls.target, camera.position).cross(up).normalize();
  const q = new THREE.Quaternion().setFromAxisAngle(up, -Math.PI * dx / hh);
  const qp = new THREE.Quaternion().setFromAxisAngle(right, -Math.PI * dy / hh);
  const f2 = new THREE.Vector3().subVectors(controls.target, camera.position).normalize().applyQuaternion(qp);
  if (Math.abs(f2.dot(up)) < 0.995) q.multiply(qp);
  for (const v of [camera.position, controls.target]) v.sub(pivot).applyQuaternion(q).add(pivot);
  camera.lookAt(controls.target);
});
dom.addEventListener("pointerup", (e) => {
  pts.delete(e.pointerId);
  if (!moved && down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 4) {
    const hits = hitAt(e.clientX, e.clientY).intersectObjects(recs.map((x) => x.mesh).filter((m) => m.visible), false);
    const h = hits.find((x) => !x.object.userData.rec.hidden) || hits[0];
    pick(h ? h.object.userData.rec.rows : [], e.ctrlKey || e.metaKey);
  }
  last = null;
});

// ---------------------------------------------------------- 表
const stepEnabled = (r, i) => ((doc.types[r.type] || { names: [] }).names[i + 1] || "").length > 1;
const stepLabel = (r, i) => (doc.types[r.type] || { names: [] }).names[i + 1] || "";
const rgbCss = (c) => c ? `rgb(${c[0]},${c[1]},${c[2]})` : "#888";
let stepView = 0;
const memoKey = "repairstage.offline.memos." + meta.id;
function shownMemos() {
  let pick = null; try { pick = JSON.parse(localStorage.getItem(memoKey) || "null"); } catch { /* 既定 */ }
  const all = doc.memoHeads.map((h, i) => i);
  if (!Array.isArray(pick)) return all.slice(0, 1);
  return all.filter((i) => pick.includes(doc.memoHeads[i]));
}
function buildMemoPick() {
  const box = $("memoPickList"); box.innerHTML = "";
  const shown = new Set(shownMemos());
  doc.memoHeads.forEach((h, i) => {
    const lab = document.createElement("label"), cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = shown.has(i);
    cb.onchange = () => { const names = [...box.querySelectorAll("input")].map((x, k) => x.checked ? doc.memoHeads[k] : null).filter(Boolean); try { localStorage.setItem(memoKey, JSON.stringify(names)); } catch { /* 覚えられなくても動く */ } buildTable(); };
    lab.append(cb, " " + h); box.appendChild(lab);
  });
}
const photosOf = (row) => meta.photos[String(row)] || [];
function buildTable() {
  const head = $("thead"); head.innerHTML = "";
  for (const h of ["行", "部位の名称", "タイプ", "段階", "写真"]) { const th = document.createElement("th"); th.textContent = h; head.appendChild(th); }
  const th = document.createElement("th"), sel = document.createElement("select");
  doc.stepHeads.forEach((h, i) => sel.add(new Option(h, String(i)))); sel.value = String(stepView);
  sel.onchange = () => { stepView = Number(sel.value); buildTable(); };
  th.appendChild(sel); head.appendChild(th);
  for (const i of shownMemos()) { const t = document.createElement("th"); t.textContent = doc.memoHeads[i]; head.appendChild(t); }
  const body = $("tbody"); body.innerHTML = "";
  for (const r of doc.rows) {
    const tr = document.createElement("tr"); tr.dataset.row = r.row; if (selected.has(r.row)) tr.classList.add("sel");
    const td = (t, cls) => { const c = document.createElement("td"); if (cls) c.className = cls; c.textContent = t; tr.appendChild(c); return c; };
    td(r.row, "num"); td(r.name); td(r.type);
    const st = td(""); const ch = document.createElement("span"); ch.className = "chip"; ch.style.background = rgbCss(r.rgb); st.append(ch, r.stage + (r.transp >= 1 ? "（出ない）" : ""));
    td(photosOf(r.row).length || "", "num");
    const sc = td(""); const lab = document.createElement("span"); lab.className = "stepLabel"; lab.textContent = stepEnabled(r, stepView) ? stepLabel(r, stepView) : "－"; sc.append(lab, r.steps[stepView] || "");
    for (const i of shownMemos()) td(r.memos[i] || "");
    tr.onclick = (e) => { pick([r.row], e.ctrlKey || e.metaKey); };
    tr.ondblclick = () => frame(boxOf(byRow.get(r.row) || []));
    body.appendChild(tr);
  }
  filter();
}
function filter() {
  const q = $("q").value.trim().toLowerCase(), ft = $("fType").value, fs = $("fStage").value;
  for (const tr of $("tbody").children) { const r = rowsByNo.get(Number(tr.dataset.row)); tr.hidden = (q && !(r.name + " " + r.memos.join(" ")).toLowerCase().includes(q)) || (ft && r.type !== ft) || (fs && r.stage !== fs); }
}
$("q").oninput = filter; $("fType").onchange = filter; $("fStage").onchange = filter;
for (const t of new Set(doc.rows.map((r) => r.type))) $("fType").add(new Option(t, t));
for (const s of new Set(doc.rows.map((r) => r.stage))) $("fStage").add(new Option(s, s));

function pick(rows, add) {
  if (!add) selected.clear();
  for (const n of rows) add && selected.has(n) ? selected.delete(n) : selected.add(n);
  for (const tr of $("tbody").children) tr.classList.toggle("sel", selected.has(Number(tr.dataset.row)));
  const tr = rows.length && $("tbody").querySelector(`tr[data-row="${rows[0]}"]`);
  if (tr && !document.body.classList.contains("noTable")) tr.scrollIntoView({ block: "center" });
  paintSel(); detail();
}

function detail() {
  const box = $("detail");
  if (selected.size !== 1) { box.hidden = true; return; }
  const r = rowsByNo.get([...selected][0]); box.innerHTML = "";
  const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.onclick = () => pick([], false);
  const h = document.createElement("h4"); h.textContent = `${r.row} 行　${r.name}`;
  const dl = document.createElement("dl");
  const item = (k, v) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); if (v instanceof Node) dd.append(v); else dd.textContent = v; dl.append(dt, dd); };
  item("タイプ", r.type);
  const st = document.createElement("span"); const ch = document.createElement("span"); ch.className = "chip"; ch.style.background = rgbCss(r.rgb); st.append(ch, r.stage); item("段階", st);
  r.steps.forEach((v, i) => { if (stepEnabled(r, i)) item(`${doc.stepHeads[i]} ${stepLabel(r, i)}`, v || "－"); });
  box.append(x, h, dl);
  const ms = shownMemos();
  if (ms.length) { const t = document.createElement("div"); t.className = "sec"; t.textContent = "メモ"; const ml = document.createElement("dl"); box.append(t, ml); for (const i of ms) { const dt = document.createElement("dt"); dt.textContent = doc.memoHeads[i]; const dd = document.createElement("dd"); dd.textContent = r.memos[i] || "－"; ml.append(dt, dd); } }
  const ps = photosOf(r.row);
  if (ps.length) {
    const t = document.createElement("div"); t.className = "sec"; t.textContent = `写真（${ps.length}）`;
    const th = document.createElement("div"); th.className = "thumbs";
    ps.forEach((p) => { const img = document.createElement("img"); img.src = p.img; img.title = `${p.n || ""} ${p.d || ""}`; img.onclick = () => { $("photoBig").src = p.img; $("photoInfo").textContent = `${r.row} 行　${p.n || ""}　${p.d || ""}`; $("dlgPhoto").showModal(); }; th.appendChild(img); });
    box.append(t, th);
  }
  box.hidden = false;
}

function legend() {
  const count = new Map();
  for (const r of doc.rows) { const k = r.type + "\t" + r.stage; const c = count.get(k) || { n: 0, rgb: r.rgb, hidden: r.transp >= 1 }; c.n++; count.set(k, c); }
  const box = $("legend"); box.innerHTML = "";
  for (const [k, c] of [...count.entries()].sort()) { const [t, s] = k.split("\t"); const d = document.createElement("div"); const ch = document.createElement("span"); ch.className = "chip"; ch.style.background = rgbCss(c.rgb); ch.style.opacity = c.hidden ? 0.25 : 1; d.append(ch, `${t}：${s}${c.hidden ? "（出ない）" : ""}  ${c.n}`); box.appendChild(d); }
}

$("btnTable").onclick = () => { const on = document.body.classList.toggle("noTable"); $("btnTable").classList.toggle("on", !on); $("btnTable").textContent = on ? "表を出す" : "表"; };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") pick([], false); });

buildMemoPick(); buildTable(); legend(); fit();
$("status").textContent = `${doc.rows.length} 箇所。3D はクリックで選択、表の行をダブルクリックでその場所へ`;
</script>
</body>
</html>
