<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>施工段階</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.66/web-ifc-api.js",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "3d-tiles-renderer": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.3.46/src/index.js",
  "3d-tiles-renderer/plugins": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.3.46/src/plugins/index.js"
} }
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
<p id="boot" style="padding:16px;font:14px sans-serif">読み込み中…</p>
<script type="module">
// ★骨組み（body.html）・見た目・プログラムを、毎回 version.json の同じ版でそろえて読む。
//   Pages は index.html を 10 分覚えるので、骨組みだけ古いまま新しい app.js が走って止まった（2026-10-02 Chrome）
const v = (await (await fetch("version.json?t=" + Date.now(), { cache: "no-store" })).json()).v;
const css = document.createElement("link");
css.rel = "stylesheet"; css.href = "style.css?v=" + v;
document.head.appendChild(css);
document.body.innerHTML = await (await fetch("body.html?v=" + v, { cache: "no-store" })).text();
await import("./app.js?v=" + v);
</script>
</body>
</html>
